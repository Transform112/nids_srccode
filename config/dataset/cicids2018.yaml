# Primary dataset: NF-CICIDS2018-v3
# 20,115,529 rows, 181,876 source IPs, 14 attack classes.
data:
  dataset: cicids2018
  node_granularity: ip
graph:
  node_granularity: ip
  # Coarsened from the docs/07_HYPERPARAMETERS.md default (1s/1s) to keep a
  # single training epoch tractable on one Kaggle GPU session: 1s anchor bins
  # produced 61,692 bins/epoch at ~4-5 sec/bin uncached (~82h/epoch). See
  # docs/TODO.md "Open decisions". Must match the graph.* settings the
  # precomputed cache in results/runs/cicids2018_stage1/cache/ was built
  # with — argus.graph.cache.verify_or_write_cache_meta raises on mismatch.
  anchor_bin_seconds: 10
  window_short_seconds: 10

loss:
  # docs/06_TRAINING.md §4 specifies nu = 0.999, which is Cui et al.'s value for
  # CIFAR-LT (n_c from 5,000 down to 50). The effective-number correction
  # saturates at 1/(1-nu) samples, so nu = 0.999 stops discriminating above
  # ~1,000 — and after n_per_class capping this split's classes run from
  # 53,894 down to 308. Measured on the real training split, nu = 0.999 gives
  # every class from `dos_goldeneye` (2,030) upward an identical weight: a
  # 3.8x total spread against a residual 175:1 imbalance, i.e. very nearly
  # no correction at all. nu = 0.9999 moves the saturation point to ~10,000
  # and yields a 32.8x spread — a real but still bounded correction, well
  # short of the 175x that full inverse-frequency weighting would apply to
  # 308 `sql_injection` rows. Revert with
  #   --set loss.effective_number_nu=0.999
  effective_number_nu: 0.9999

classes:
  benign: Benign
  attacks:
    - DDOS_attack-HOIC
    - FTP-BruteForce
    - DDoS_attacks-LOIC-HTTP
    - Bot
    - SSH-Bruteforce
    - Infilteration
    - DoS_attacks-SlowHTTPTest
    - DoS_attacks-Hulk
    - DoS_attacks-GoldenEye
    - DoS_attacks-Slowloris
    - DDOS_attack-LOIC-UDP
    - Brute_Force_-Web
    - Brute_Force_-XSS
    - SQL_Injection
  canonical:
    Infilteration: Infiltration
  families:
    dos:
      - DoS_attacks-Hulk
      - DoS_attacks-GoldenEye
      - DoS_attacks-Slowloris
      - DoS_attacks-SlowHTTPTest
    ddos:
      - DDOS_attack-HOIC
      - DDOS_attack-LOIC-UDP
      - DDoS_attacks-LOIC-HTTP
    brute:
      - FTP-BruteForce
      - SSH-Bruteforce
      - Brute_Force_-Web
      - Brute_Force_-XSS
    web:
      - SQL_Injection
      - Brute_Force_-XSS
      - Brute_Force_-Web
    other:
      - Bot
      - Infiltration
