[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Open-world, structure-robust, temporally-grounded graph NIDS"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "joblib>=1.4",
    "tqdm>=4.66",
    "rich>=13.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
baselines = ["torch-geometric>=2.6"]
xai = ["shap>=0.45"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
argus = "argus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
